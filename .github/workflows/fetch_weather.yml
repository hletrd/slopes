name: 날씨 업데이트

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: weather-update
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Keep last valid observations for temporary source outages
        run: |
          if ! curl --fail --silent --show-error --max-time 20 https://ski.atik.kr/weather.json -o weather.json; then
            rm -f weather.json
          fi

      - name: Test weather parsing
        run: python -m unittest discover -s .github/scripts -p 'test_weather_data.py'

      - name: Fetch weather data
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python .github/scripts/fetch_weather_data.py

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "weather.json preview.png"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          TARGET: ${{ secrets.SSH_TARGET }}
